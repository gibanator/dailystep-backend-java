spring:
  application:
    name: dailystep-backend-java

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    callback-locations: classpath:db/migration

  devtools:
    livereload:
      enabled: false

  web:
    error:
      include-message: always
      include-stacktrace: never
      include-path: never

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_SENDER_ADDRESS}
    password: ${EMAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    # Выбираем GigaChat как autoconfig-модель Spring AI. Это ОТКЛЮЧАЕТ autoconfig
    # Anthropic/OpenAI-стартеров (их условие — spring.ai.model.chat=anthropic/openai),
    # поэтому без ключа они не пытаются подняться. Модели Claude/Qwen/DeepSeek собираем
    # вручную и с гейтом по ключу в AiEvaluatorsConfig — провайдер появляется, только когда ключ задан.
    model:
      chat: gigachat
      # Остальные типы моделей не используем. Явно отключаем, иначе OpenAI-стартер
      # (и giga) поднимали бы embedding/image/audio/moderation-бины, которым нужен ключ.
      embedding: none
      image: none
      moderation: none
      audio:
        transcription: none
        speech: none
    gigachat:
      auth:
        bearer:
          api-key: ${GIGACHAT_API_KEY:}
        scope: ${GIGACHAT_SCOPE:GIGACHAT_API_PERS}
        # dev: пропускаем проверку TLS-сертификата. В проде заменить на сертификаты Минцифры.
        unsafe-ssl: ${GIGACHAT_UNSAFE_SSL:true}
      chat:
        options:
          model: ${GIGACHAT_MODEL:GigaChat}
          temperature: 0.3
          max-tokens: 1024

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000